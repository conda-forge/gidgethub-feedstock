{% set name = "gidgethub" %}
{% set version = "6.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/gidgethub-{{ version }}.tar.gz
  sha256: 4e6ef8acdb45571222ea6f7ec90ec8ca93df847391daac9502562780f1988369

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - flit
    - pip
  run:
    - typing_extensions >=4.0.0
    - python >={{ python_min }}
    - uritemplate >=3.0.1
    - pyjwt >=2.4.0

test:
  imports:
    - gidgethub
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://gidgethub.readthedocs.io/en/latest/
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: An async GitHub API library for Python

  doc_url: https://gidgethub.readthedocs.io/en/latest/
  dev_url: https://github.com/brettcannon/gidgethub

extra:
  recipe-maintainers:
    - asmeurer
    - ocefpaf
