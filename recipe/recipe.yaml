schema_version: 1

context:
  version: "6.0.0"

package:
  name: gidgethub
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gidgethub/gidgethub-${{ version }}.tar.gz
  sha256: 4e6ef8acdb45571222ea6f7ec90ec8ca93df847391daac9502562780f1988369

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pdm-backend
    - pip
  run:
    - python >=${{ python_min }}
    - uritemplate >=3.0.1
    - pyjwt >=2.4.0
    - typing_extensions >=4.0.0

tests:
  - python:
      imports:
        - gidgethub
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: An async GitHub API library
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/gidgethub/
  documentation: https://gidgethub.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
